<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--/* Shared chrome for every mail template: head, header, footer, greeting and button live ONLY here.
     Context, always set by AuthMailService: siteName, logoUrl (null when app.logo-url is blank), contactEmail,
     frontendUrl (no trailing slash), greetingName.
     No template formats a date or a number itself: AuthMailService passes finished strings in the recipient's
     language. */-->

<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <style>
    /* Break inside a word only when the word alone does not fit (a long reset link). */
    td,
    th,
    p {
      overflow-wrap: break-word;
    }

    /* Blink inflates text in a narrow viewport on top of the reader's own font scale. */
    body,
    table,
    td {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background-color: #ffffff;
    }

    /* Base sizes ride inline on every element (Outlook's Word engine ignores media queries). This block only
       shrinks. */
    @media (max-width: 480px) {
      .email-container {
        padding: 12px !important;
      }

      .email-container h2 {
        font-size: 19px !important;
      }

      .email-container p {
        font-size: 13px !important;
      }

      .small-text {
        font-size: 11px !important;
      }
    }

    /* Keyed on the inline colours the templates use; a new colour needs its dark twin here. */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1a1a1a !important;
      }

      .email-container {
        background-color: #242424 !important;
      }

      [style*="background: #fff3cd"] {
        background-color: #3d3416 !important;
      }

      [style*="color: #333"] {
        color: #e8e8e8 !important;
      }

      [style*="color: #666"] {
        color: #b4b4b4 !important;
      }

      [style*="color: #888"] {
        color: #9a9a9a !important;
      }

      [style*="color: #b9573f"] {
        color: #e88a72 !important;
      }

      [style*="#e0e0e0"] {
        border-color: #3a3a3a !important;
      }

      [style*="#ffeaa7"] {
        border-color: #5c4d1a !important;
      }
    }
  </style>
</head>

<body>

  <th:block th:fragment="header">
    <div style="padding: 20px 0; border-bottom: 2px solid #e0e0e0; margin-bottom: 24px;">
      <table cellpadding="0" cellspacing="0" border="0" role="presentation">
        <tr>
          <td th:if="${!#strings.isEmpty(logoUrl)}" style="vertical-align: middle; padding-right: 8px;">
            <img th:src="${logoUrl}" th:alt="${siteName}" alt="" width="36" height="36" style="display: block;">
          </td>
          <td style="vertical-align: middle;">
            <span style="font-size: 22px; font-weight: bold; color: #333;" th:text="${siteName}">billet-studio</span>
          </td>
        </tr>
      </table>
    </div>
  </th:block>

  <th:block th:fragment="footer">
    <div
      style="border-top: 1px solid #e0e0e0; margin-top: 32px; padding-top: 20px; text-align: center; color: #888; font-size: 13px;">
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="margin: 0 auto 8px auto;">
        <tr>
          <td th:if="${!#strings.isEmpty(logoUrl)}" style="vertical-align: middle; padding-right: 6px;">
            <img th:src="${logoUrl}" th:alt="${siteName}" alt="" width="24" height="24" style="display: block;">
          </td>
          <td style="vertical-align: middle;">
            <span style="font-size: 14px; font-weight: bold; color: #888;" th:text="${siteName}">billet-studio</span>
          </td>
        </tr>
      </table>
      <!--/* Spelled out as a link, or the client invents one and paints it blue and underlined. */-->
      <p class="small-text" style="margin: 4px 0; font-size: 13px;">
        <a th:href="'mailto:' + ${contactEmail}" th:text="${contactEmail}"
          style="color: #888; text-decoration: none;">kontakt@example.com</a>
      </p>
    </div>
  </th:block>

  <!--/* greeting(salutation, name): "Hallo Max," or "Hallo," when the name is blank. The name is shown as-is. */-->
  <p th:fragment="greeting(salutation, name)" style="margin: 0 0 16px 0;"
    th:text="${name != null and !#strings.isEmpty(name) ? salutation + ' ' + name + ',' : salutation + ','}">Hallo,</p>

  <!--/* button(href, label): the one call to action of a mail. The table cell carries the colour, so clients that
         drop padding on links (Outlook) still show a button. */-->
  <table th:fragment="button(href, label)" cellpadding="0" cellspacing="0" border="0" role="presentation"
    style="margin: 24px 0;">
    <tr>
      <td style="background: #b9573f; border-radius: 6px;">
        <a th:href="${href}" th:text="${label}"
          style="display: inline-block; padding: 12px 24px; color: #ffffff; text-decoration: none; font-weight: bold; font-size: 15px;">Label</a>
      </td>
    </tr>
  </table>

</body>

</html>
