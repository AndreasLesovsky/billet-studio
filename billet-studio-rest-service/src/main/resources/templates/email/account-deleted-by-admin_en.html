<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{email/_fragments :: head}"></head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; font-size: 14px; line-height: 1.6; color: #333;">
<div class="email-container" style="max-width: 600px; margin: 0 auto; padding: 16px;">

  <th:block th:replace="~{email/_fragments :: header}"></th:block>

  <h2 style="margin: 0 0 16px 0; font-size: 22px; color: #333;">Your account has been deleted</h2>

  <th:block th:replace="~{email/_fragments :: greeting('Hello', ${greetingName})}"></th:block>
  <p>Your account has been deleted by an administrator.</p>
  <p>Your account data, your profile picture and all your billets have been deleted. Links you used to share billets no longer work.</p>

  <div style="background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 6px; padding: 16px; margin: 24px 0;">
    <p style="margin: 0 0 8px 0;"><strong>Any questions? Write to us:</strong></p>
    <p style="margin: 0;"><a th:href="'mailto:' + ${contactEmail}" th:text="${contactEmail}" style="color: #b9573f;">kontakt@example.com</a></p>
  </div>

  <th:block th:replace="~{email/_fragments :: footer}"></th:block>

</div>
</body>
</html>
