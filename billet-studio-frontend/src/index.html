<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>billet-studio</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      name="description"
      content="billet-studio – digitale Billets mit 3D-Modell gestalten und per Link teilen."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon-32.png"
    />
    <link
      rel="apple-touch-icon"
      href="apple-touch-icon.png"
    />
    <!-- Generated by tools/asset-pipeline: every @font-face in one file. Browsers only download
         the woff2 files that a rendered element actually uses. data-beasties-skip: the build's
         critical-CSS inliner cannot see public/ files and would only warn. -->
    <link
      rel="stylesheet"
      href="fonts/fonts.css"
      data-beasties-skip
    />
    <script src="env.js"></script>
    <!-- Sets data-theme / data-mode on <html> before the first paint, so no theme flash. -->
    <script src="theme-boot.js"></script>
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
