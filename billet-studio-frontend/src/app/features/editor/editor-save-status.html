@if (variant() === 'icons') {
  <span appTooltipAnchor>
    <span
      class="editor-save-status__icons"
      role="img"
      tabindex="0"
      aria-labelledby="editor-save-status-tip"
    >
      <span [class]="indicator().className">
        <i
          class="bi"
          [class]="indicator().icon"
          aria-hidden="true"
        ></i>
      </span>
      @if (badge(); as badge) {
        <span
          class="ui-badge"
          [class]="badge.className"
        >
          <i
            class="bi"
            [class]="badge.icon"
            aria-hidden="true"
          ></i>
        </span>
      }
    </span>
    <span
      id="editor-save-status-tip"
      class="ui-tooltip"
      role="tooltip"
    >
      <span>{{ indicator().key | translate }}</span>
      @if (badge(); as badge) {
        <span>{{ badge.key | translate }}</span>
      }
    </span>
  </span>
} @else {
  <span
    [class]="indicator().className"
    [title]="indicator().key | translate"
  >
    <i
      class="bi"
      [class]="indicator().icon"
      aria-hidden="true"
    ></i>
    <span class="editor-save-status__text">{{ indicator().key | translate }}</span>
  </span>
  @if (facts(); as facts) {
    <app-publish-badge [facts]="facts" />
  }
}
