<div class="editor">
  <div class="ui-editor-bar editor-skeleton__bar">
    @if (layout() === 'narrow') {
      <span class="ui-skeleton ui-skeleton--button ui-skeleton--icon"></span>
      <span class="editor-skeleton__title-text">
        <span class="ui-skeleton ui-skeleton--text ui-skeleton--medium"></span>
      </span>
    } @else {
      <span class="ui-skeleton ui-skeleton--control editor-skeleton__title"></span>
    }
    <span class="editor-skeleton__history">
      <span class="ui-skeleton ui-skeleton--button ui-skeleton--icon"></span>
      <span class="ui-skeleton ui-skeleton--button ui-skeleton--icon"></span>
    </span>
    @if (layout() === 'wide') {
      <span class="ui-skeleton ui-skeleton--button editor-skeleton__modes"></span>
      <span class="ui-skeleton ui-skeleton--button"></span>
      <span class="ui-skeleton ui-skeleton--button editor-skeleton__lang"></span>
      <span class="editor-skeleton__status">
        <span class="ui-hint ui-skeleton ui-skeleton--text"></span>
      </span>
    } @else if (layout() === 'medium') {
      <span class="ui-skeleton ui-skeleton--circle editor-skeleton__status-icon"></span>
    }
    <span
      class="ui-skeleton ui-skeleton--button editor-skeleton__share"
      [class.ui-skeleton--icon]="layout() === 'narrow'"
    ></span>
    @if (layout() === 'medium') {
      <span class="ui-skeleton ui-skeleton--button editor-skeleton__more"></span>
    }
  </div>

  <div class="editor__workspace">
    <div
      class="editor__tabs"
      [class]="tabBarClass()"
    >
      @for (tab of tabs(); track tab) {
        <span [class]="tabClass()">
          <span class="ui-skeleton ui-skeleton--circle editor-skeleton__tab-icon"></span>
          <span class="ui-skeleton ui-skeleton--text ui-tab__label"></span>
        </span>
      }
    </div>

    <div class="editor__content">
      <div class="ui-stack ui-stack--lg">
        <div class="ui-card">
          <div class="ui-card__header">
            <span class="ui-card__title ui-skeleton ui-skeleton--text ui-skeleton--short"></span>
          </div>
          <div class="ui-card__body ui-stack">
            <app-field-skeleton [hints]="2" />
            <app-field-skeleton
              [hints]="1"
              [errorSlot]="false"
            />
          </div>
        </div>
        <div class="ui-card">
          <div class="ui-card__header">
            <span class="ui-card__title ui-skeleton ui-skeleton--text ui-skeleton--short"></span>
          </div>
          <div class="ui-card__body ui-stack">
            <app-field-skeleton />
            <app-field-skeleton />
            <app-field-skeleton />
            <app-field-skeleton />
          </div>
        </div>
      </div>
    </div>

    @if (layout() !== 'narrow') {
      <div class="ui-stage editor__preview editor-skeleton__preview">
        <span class="ui-skeleton ui-skeleton--button editor-skeleton__device-bar"></span>
        <span class="ui-skeleton editor-skeleton__device"></span>
      </div>
    }

    @if (layout() === 'wide') {
      <div class="editor__inspector">
        <div class="ui-card">
          <div class="ui-card__header">
            <span class="ui-card__title ui-skeleton ui-skeleton--text ui-skeleton--short"></span>
          </div>
          <div class="ui-card__body ui-stack">
            <app-field-skeleton [hints]="2" />
            <app-field-skeleton [hints]="1" />
            <app-field-skeleton />
          </div>
        </div>
      </div>
    }
  </div>
</div>
