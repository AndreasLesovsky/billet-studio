<dialog
  class="ui-dialog"
  aria-labelledby="lock-user-title"
  aria-describedby="lock-user-text"
  [appModal]="user() !== null"
  (dismissed)="cancel()"
  (closed)="onClosed()"
>
  <div class="ui-dialog__header">
    <h2
      id="lock-user-title"
      class="ui-dialog__title"
    >
      {{ 'ADMIN_USERS.LOCK_TITLE' | translate }}
    </h2>
    <button
      type="button"
      class="ui-btn ui-btn--ghost ui-btn--icon ui-btn--sm"
      [attr.aria-label]="'COMMON.CLOSE' | translate"
      [disabled]="loading()"
      (click)="cancel()"
    >
      <i
        class="bi bi-x-lg"
        aria-hidden="true"
      ></i>
    </button>
  </div>

  <form
    id="lock-user-form"
    class="ui-dialog__body ui-stack"
    novalidate
    (submit)="onSubmit($event)"
  >
    <p id="lock-user-text">
      {{ 'ADMIN_USERS.LOCK_MESSAGE' | translate: { name: shownName() } }}
    </p>

    <div class="ui-field">
      <label
        class="ui-label"
        for="lock-user-reason"
        >{{ 'ADMIN_USERS.DEACTIVATION_REASON' | translate }}</label
      >
      <select
        id="lock-user-reason"
        class="ui-select"
        autofocus
        [formField]="lockForm.reason"
      >
        <option value="">{{ 'ADMIN_USERS.DEACTIVATION_REASON_NONE' | translate }}</option>
        @for (reason of reasons; track reason) {
          <option [value]="reason">{{ 'DEACTIVATION_REASON.' + reason | translate }}</option>
        }
      </select>
    </div>
  </form>

  <div class="ui-dialog__footer">
    <button
      type="button"
      class="ui-btn ui-btn--neutral"
      [disabled]="loading()"
      (click)="cancel()"
    >
      {{ 'COMMON.CANCEL' | translate }}
    </button>
    <button
      type="submit"
      form="lock-user-form"
      class="ui-btn ui-btn--danger"
      [disabled]="loading()"
    >
      <i
        class="bi bi-lock"
        aria-hidden="true"
      ></i>
      {{ 'ADMIN_USERS.LOCK' | translate }}
    </button>
  </div>
</dialog>
