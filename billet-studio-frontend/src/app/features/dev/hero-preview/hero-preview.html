<div
  class="hero-preview"
  [class.hero-preview--capture]="capture"
>
  <app-hero-story
    class="hero-preview__stage"
    [style.--hero-stage-aspect]="stageAspect()"
  />
  <app-hero-chapters class="hero-preview__chapters" />
  @if (debug) {
    <pre class="hero-preview__state">{{ state() }}</pre>
  }
</div>
