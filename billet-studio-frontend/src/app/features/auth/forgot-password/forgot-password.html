<div class="ui-container">
  <div class="ui-page auth-page">
    <header class="ui-page__header">
      <h1 class="ui-page__title">{{ 'AUTH.FORGOT_PASSWORD_TITLE' | translate }}</h1>
      <p class="ui-page__lead">{{ 'AUTH.FORGOT_PASSWORD_LEAD' | translate }}</p>
    </header>

    <div class="ui-card">
      @if (submitted()) {
        <div class="ui-card__body ui-stack auth-page__done">
          <i
            class="bi bi-envelope-check"
            aria-hidden="true"
          ></i>
          <h2
            #doneHeading
            class="ui-card__title"
            tabindex="-1"
          >
            {{ 'AUTH.RESET_LINK_SENT_TITLE' | translate }}
          </h2>
          <p class="ui-hint">{{ 'AUTH.RESET_LINK_SENT_TEXT' | translate }}</p>
          <a
            class="ui-btn ui-btn--primary"
            routerLink="/login"
            >{{ 'AUTH.GO_TO_LOGIN' | translate }}</a
          >
        </div>
      } @else {
        <form
          class="ui-card__body ui-stack"
          novalidate
          (submit)="onSubmit($event)"
        >
          <div class="ui-field">
            <label
              class="ui-label"
              for="forgot-email"
              >{{ 'AUTH.EMAIL' | translate }}</label
            >
            <input
              id="forgot-email"
              class="ui-input"
              type="email"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
              [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate"
              [formField]="forgotForm.email"
            />
            <app-field-error [field]="forgotForm.email" />
          </div>

          <button
            type="submit"
            class="ui-btn ui-btn--primary ui-btn--lg ui-btn--block"
            [disabled]="!forgotForm().valid()"
          >
            <i
              class="bi bi-envelope"
              aria-hidden="true"
            ></i>
            {{ 'AUTH.SEND_RESET_LINK' | translate }}
          </button>
        </form>

        <p class="ui-card__footer auth-page__switch">
          <a
            class="ui-link"
            routerLink="/login"
            >{{ 'AUTH.GO_TO_LOGIN' | translate }}</a
          >
        </p>
      }
    </div>
  </div>
</div>
