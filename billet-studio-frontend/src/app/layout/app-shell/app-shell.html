<a
  class="ui-skip-link"
  href="#main-content"
  >{{ 'COMMON.SKIP_TO_CONTENT' | translate }}</a
>

<header class="ui-app-header shell__header">
  <div class="ui-container shell__bar">
    <a
      class="ui-wordmark shell__brand"
      routerLink="/"
      ><span
        class="ui-wordmark__mark"
        aria-hidden="true"
      ></span
      ><span>billet<span class="ui-wordmark__accent">-studio</span></span></a
    >

    <nav
      class="shell__nav"
      [attr.aria-label]="'NAV.MAIN' | translate"
    >
      <ul
        class="shell__nav-list"
        role="list"
      >
        <li>
          <a
            class="ui-tab"
            routerLink="/"
            routerLinkActive
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            >{{ 'NAV.TEMPLATES' | translate }}</a
          >
        </li>
        <li>
          <a
            class="ui-tab"
            routerLink="/billets"
            routerLinkActive
            ariaCurrentWhenActive="page"
            >{{ 'NAV.BILLETS' | translate }}</a
          >
        </li>
      </ul>
    </nav>

    <div class="shell__tools">
      <app-language-switch />
      <app-color-mode-menu />
      <app-account-menu />
    </div>
  </div>
</header>

<main
  id="main-content"
  class="shell__main"
>
  <div class="ui-container">
    <app-breadcrumb />
  </div>
  <router-outlet />
</main>

<footer class="ui-app-footer shell__footer">
  <div class="ui-container shell__footer-inner">
    <span>© {{ year }} billet-studio</span>
    <span>{{ 'FOOTER.TAGLINE' | translate }}</span>
  </div>
</footer>
