<a
  class="ui-skip-link"
  href="#main-content"
  >{{ 'COMMON.SKIP_TO_CONTENT' | translate }}</a
>

<header class="ui-app-header shell__header">
  <div class="ui-container shell__bar">
    <a
      class="ui-wordmark shell__brand"
      routerLink="/"
      >billet<span class="ui-wordmark__accent">-studio</span></a
    >

    <nav
      class="shell__nav"
      [attr.aria-label]="'NAV.MAIN' | translate"
    >
      <ul
        class="shell__nav-list"
        role="list"
      >
        <li>
          <a
            class="ui-tab"
            routerLink="/"
            routerLinkActive
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            >{{ 'NAV.TEMPLATES' | translate }}</a
          >
        </li>
        <li>
          <a
            class="ui-tab"
            routerLink="/billets"
            routerLinkActive
            ariaCurrentWhenActive="page"
            >{{ 'NAV.BILLETS' | translate }}</a
          >
        </li>
      </ul>
    </nav>

    <div class="shell__tools">
      <app-language-switch />
      <button
        type="button"
        class="ui-btn ui-btn--ghost ui-btn--icon"
        cdkOverlayOrigin
        #themeOrigin="cdkOverlayOrigin"
        aria-haspopup="dialog"
        [attr.aria-label]="'NAV.THEME' | translate"
        [attr.aria-expanded]="themeOpen()"
        [attr.aria-controls]="themeOpen() ? 'shell-theme-popover' : null"
        (click)="toggleTheme()"
      >
        <i
          class="bi bi-palette"
          aria-hidden="true"
        ></i>
      </button>
      <app-account-menu />
    </div>
  </div>
</header>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="themeOrigin"
  [cdkConnectedOverlayOpen]="themeOpen()"
  [cdkConnectedOverlayPositions]="themePositions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="themeViewportMargin"
  (overlayOutsideClick)="closeTheme()"
  (overlayKeydown)="onThemeKeydown($event)"
  (detach)="closeTheme()"
>
  <div
    id="shell-theme-popover"
    class="ui-popover shell__theme"
    role="dialog"
    aria-labelledby="shell-theme-title"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
  >
    <div class="shell__theme-header">
      <h2
        id="shell-theme-title"
        class="ui-card__title"
      >
        {{ 'NAV.THEME' | translate }}
      </h2>
      <button
        type="button"
        class="ui-btn ui-btn--ghost ui-btn--icon ui-btn--sm"
        [attr.aria-label]="'COMMON.CLOSE' | translate"
        (click)="closeTheme()"
      >
        <i
          class="bi bi-x-lg"
          aria-hidden="true"
        ></i>
      </button>
    </div>
    <app-theme-picker />
  </div>
</ng-template>

<main
  id="main-content"
  class="shell__main"
>
  <div class="ui-container">
    <app-breadcrumb />
  </div>
  <router-outlet />
</main>

<footer class="ui-app-footer shell__footer">
  <div class="ui-container shell__footer-inner">
    <span>© {{ year }} billet-studio</span>
    <span>{{ 'FOOTER.TAGLINE' | translate }}</span>
  </div>
</footer>
