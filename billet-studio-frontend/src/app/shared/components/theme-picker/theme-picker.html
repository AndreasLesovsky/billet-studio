<fieldset
  class="theme-picker"
  [disabled]="disabled()"
  (focusout)="onFocusOut($event)"
>
  <legend class="ui-label theme-picker__legend">{{ 'THEME_PICKER.LABEL' | translate }}</legend>
  <div class="theme-picker__grid">
    @for (card of cards(); track card.id) {
      <label class="ui-theme-option">
        <input
          type="radio"
          class="ui-visually-hidden"
          [name]="group"
          [value]="card.id"
          [checked]="selected() === card.id"
          (change)="select(card.id)"
        />
        <span class="ui-theme-option__frame">
          <span
            class="ui-theme-card"
            aria-hidden="true"
            [style.background-color]="card.background"
          >
            <span
              class="theme-picker__hero"
              [style.background-color]="card.hero"
            >
              <span
                class="theme-picker__line"
                [style]="card.title"
                >Aa</span
              >
              <span
                class="theme-picker__line"
                [style]="card.titleAccent"
                >{{ 'THEME_PICKER.SAMPLE_TITLE' | translate }}</span
              >
            </span>
            <span
              class="theme-picker__line theme-picker__body"
              [style]="card.body"
              >{{ 'THEME_PICKER.SAMPLE_BODY' | translate }}</span
            >
            <span class="theme-picker__particles">
              @for (color of card.particles; track $index) {
                <span
                  class="theme-picker__dot"
                  [style.background-color]="color"
                ></span>
              }
            </span>
          </span>
        </span>
        <span class="ui-theme-option__name">
          <i
            class="bi bi-check-circle-fill ui-theme-option__check"
            aria-hidden="true"
          ></i>
          {{ card.nameKey | translate }}
        </span>
      </label>
    }
  </div>
</fieldset>
